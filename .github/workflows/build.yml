name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name || github.run_id }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: Build Windows
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

  build-macos:
    name: macOS (Universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: Build macOS
        run: npm run build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

  build-linux:
    name: Linux (AppImage, Deb, Rpm, Tar)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm zstd

      - name: Build Linux
        run: npm run build:linux
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.tar.xz
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

  build-pacman:
    name: Pacman (Arch Linux)
    runs-on: ubuntu-latest
    needs: build-linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download Linux tar.xz
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: artifacts/

      - name: Setup pacman build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y pacman-package-manager squashfs-tools patchelf tar zstd

      - name: Build Pacman Package
        run: |
          TARBALL=$(find artifacts/ -name "*.tar.xz" | head -1)
          if [ -z "$TARBALL" ]; then
            echo "ERROR: tar.xz not found"
            exit 1
          fi

          echo "Found tarball: $TARBALL"
          mkdir -p pkgbuild
          cp PKGBUILD pkgbuild/
          cp "$TARBALL" pkgbuild/

          VERSION=$(node -p "require('./package.json').version")
          echo "Version: $VERSION"

          sed -i "s/pkgver=.*/pkgver=${VERSION}/" pkgbuild/PKGBUILD
          sed -i "s/pkgrel=.*/pkgrel=1/" pkgbuild/PKGBUILD

          cd pkgbuild
          SHA256=$(sha256sum "$(basename "$TARBALL")" | cut -d' ' -f1)
          sed -i "s/sha256sums=.*/sha256sums=('${SHA256}')/" PKGBUILD

          PKGNAME="printcat-${VERSION}-1-x86_64.pkg.tar"
          mkdir -p "printcat-pkg/opt/printcat"
          tar xf "$(basename "$TARBALL")" -C "printcat-pkg/opt/printcat" --strip-components=0

          mkdir -p "printcat-pkg/usr/bin"
          ln -s "/opt/printcat/printcat" "printcat-pkg/usr/bin/printcat"

          mkdir -p "printcat-pkg/usr/share/applications"
          mkdir -p "printcat-pkg/usr/share/pixmaps"
          if [ -f "printcat-pkg/opt/printcat/printcat.desktop" ]; then
            cp "printcat-pkg/opt/printcat/printcat.desktop" "printcat-pkg/usr/share/applications/"
          fi
          if [ -f "printcat-pkg/opt/printcat/resources/app/src/assets/icons/main.png" ]; then
            cp "printcat-pkg/opt/printcat/resources/app/src/assets/icons/main.png" "printcat-pkg/usr/share/pixmaps/printcat.png"
          fi

          {
            echo "pkgname = printcat"
            echo "pkgver = ${VERSION}-1"
            echo "pkgdesc = Premium, feature-rich cross-platform screenshot tool"
            echo "url = https://github.com/aeeryin/Printcat"
            echo "builddate = $(date +%s)"
            echo "packager = Aeeryin <artisticamente.official@gmail.com>"
            echo "size = $(du -sb printcat-pkg | cut -f1)"
            echo "arch = x86_64"
            echo "license = MIT"
            echo "depends = electron"
            echo "depends = libnotify"
            echo "depends = libxtst"
            echo "depends = nss"
            echo "depends = libxss"
            echo "depends = libappindicator-gtk3"
            echo "depends = libsecret"
          } > "printcat-pkg/.PKGINFO"

          cd printcat-pkg
          tar cf "../${PKGNAME}" .PKGINFO opt usr
          cd ..

          if command -v zstd &> /dev/null; then
            zstd -T0 "${PKGNAME}" -o "${PKGNAME}.zst" --rm
            FINAL_PKG="${PKGNAME}.zst"
          else
            xz "${PKGNAME}"
            FINAL_PKG="${PKGNAME}.xz"
          fi

          echo "Built package: ${FINAL_PKG}"
          ls -la "${FINAL_PKG}"

          mkdir -p "$GITHUB_WORKSPACE/dist"
          mv "${FINAL_PKG}" "$GITHUB_WORKSPACE/dist/"

      - uses: actions/upload-artifact@v4
        with:
          name: pacman-build
          path: dist/*.pkg.tar.*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos, build-linux, build-pacman]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Determine Version Tag
        id: get_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            PKG_VER=$(node -p "require('./package.json').version")
            TAG_NAME="v${PKG_VER}"
          fi
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: List all artifacts
        run: find artifacts/ -type f | sort

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.TAG_NAME }}
          name: "Printcat ${{ steps.get_version.outputs.TAG_NAME }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: "true"
          files: |
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.tar.xz
            artifacts/*.pkg.tar.*
            artifacts/*.blockmap
            artifacts/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
