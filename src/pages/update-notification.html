<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Printcat — Atualização disponível</title>
  <style>
    :root { color-scheme: dark; --bg: #202225; --line: rgba(255,255,255,.12); --text: #f5f7f8; --muted: #aab3ba; --accent: #13be9e; }
    * { box-sizing: border-box; user-select: none; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; background: transparent; color: var(--text); }
    .notification { width: 100%; height: 100%; padding: 17px 18px 15px; border: 1px solid var(--line); border-radius: 14px; background: linear-gradient(145deg, #25282b, #1b1d20); box-shadow: 0 16px 45px rgba(0,0,0,.48), 0 0 0 1px rgba(19,190,158,.08); animation: enter .22s ease-out; }
    @keyframes enter { from { opacity: 0; transform: translateY(10px) scale(.97); } to { opacity: 1; transform: none; } }
    .top { display: flex; align-items: flex-start; gap: 12px; }
    .logo { width: 38px; height: 38px; object-fit: contain; flex: 0 0 auto; }
    .copy { min-width: 0; flex: 1; }
    h1 { margin: 1px 0 3px; font-size: 14px; font-weight: 650; letter-spacing: -.1px; }
    p { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.45; }
    .version { display: inline-flex; margin-top: 7px; padding: 3px 8px; border: 1px solid rgba(19,190,158,.35); border-radius: 999px; color: #8be7d2; background: rgba(19,190,158,.1); font-size: 10px; font-weight: 650; }
    .close { width: 24px; height: 24px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font-size: 18px; line-height: 1; cursor: pointer; }
    .close:hover { color: var(--text); background: rgba(255,255,255,.08); }
    .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
    button.action { min-height: 30px; padding: 6px 11px; border-radius: 7px; border: 1px solid var(--line); color: var(--text); background: rgba(255,255,255,.04); font: 600 11px "Segoe UI Variable", "Segoe UI", sans-serif; cursor: pointer; }
    button.action:hover { background: rgba(255,255,255,.1); }
    button.primary { border-color: var(--accent); color: #102b25; background: var(--accent); }
    button.primary:hover { background: #35d5b7; }
    button:focus-visible { outline: 2px solid #91f2dd; outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { .notification { animation: none; } }
  </style>
</head>
<body>
  <section class="notification" role="alertdialog" aria-labelledby="notification-title" aria-describedby="notification-text">
    <div class="top">
      <img class="logo" src="../assets/images/logoNoText.png" alt="Printcat">
      <div class="copy"><h1 id="notification-title">Nova versão do Printcat disponível</h1><p id="notification-text">Uma atualização está pronta para você baixar.</p><span class="version" id="version">v0.0.0</span></div>
      <button class="close" id="close" aria-label="Depois">×</button>
    </div>
    <div class="actions"><button class="action" id="later">Depois</button><button class="action primary" id="download">Baixar atualização</button></div>
  </section>
  <script>
    const title = document.getElementById('notification-title');
    const text = document.getElementById('notification-text');
    const version = document.getElementById('version');
    const download = document.getElementById('download');
    const later = document.getElementById('later');
    const close = document.getElementById('close');
    let lang = 'pt';
    const copy = {
      pt: { title: 'Nova versão do Printcat disponível', text: 'Uma atualização está pronta para você baixar.', download: 'Baixar atualização', later: 'Depois', close: 'Depois' },
      en: { title: 'A new Printcat version is available', text: 'An update is ready for you to download.', download: 'Download update', later: 'Later', close: 'Later' }
    };
    function apply(data) {
      if (data.lang) lang = data.lang === 'pt' ? 'pt' : 'en';
      const t = copy[lang];
      title.textContent = t.title; text.textContent = t.text; download.textContent = t.download; later.textContent = t.later; close.setAttribute('aria-label', t.close);
      if (data.version) version.textContent = 'v' + data.version.replace(/^v/, '');
    }
    function send(action) { window.api.sendUpdateAction(action); }
    download.addEventListener('click', () => send('download'));
    later.addEventListener('click', () => send('later'));
    close.addEventListener('click', () => send('later'));
    window.api.onUpdateStatus(apply);
  </script>
</body>
</html>
