<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Printcat Cropper</title>
  <script>
    (function() {
      const theme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="stylesheet" href="../styles/cropper.css">
</head>

<body>
  <div id="cropper-container">
    <canvas id="view-canvas"></canvas>
    
    <!-- Magnifier loupe -->
    <div id="magnifier">
      <canvas id="mag-canvas"></canvas>
      <div id="mag-crosshair"></div>
      <div id="mag-text">0, 0</div>
    </div>

    <!-- Floating bottom toolbar matching user specifications -->
    <div id="cropper-toolbar" style="display: none;">
      <!-- Capture Primary Dropdown Pill -->
      <div class="toolbar-dropdown-wrapper">
        <button class="tb-btn tb-dropdown-btn" id="btn-capture-dropdown" title="Capture options">
          <span id="capture-label">Capture</span>
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>

        <!-- Dropdown Popup Menu -->
        <div id="capture-dropdown-menu" class="dropdown-popup" style="display: none;">
          <button class="menu-item" id="menu-editor">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
              <path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z" fill="currentColor" fill-opacity="0.25" />
            </svg>
            <span>Open in Editor</span>
          </button>
          <button class="menu-item" id="menu-clipboard">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-copy-icon lucide-copy"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
            <span>Copy to Clipboard</span>
          </button>
          <button class="menu-item" id="menu-desktop">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="3" width="20" height="14" rx="2" ry="2" fill="currentColor" fill-opacity="0.25" />
              <line x1="8" y1="21" x2="16" y2="21" />
              <line x1="12" y1="17" x2="12" y2="21" />
            </svg>
            <span>Save to Desktop</span>
          </button>
          <button class="menu-item" id="menu-print">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 6 2 18 2 18 9" />
              <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" />
              <rect x="6" y="14" width="12" height="8" fill="currentColor" fill-opacity="0.25" />
            </svg>
            <span>Print</span>
          </button>
        </div>
      </div>

      <!-- Quick Export / Copy Button -->
      <button class="tb-btn" id="tool-share" title="Copy to Clipboard">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-copy-icon lucide-copy"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
      </button>

      <!-- Move Selection (Lucide Hand Icon) -->
      <button class="tb-btn active" id="tool-move" title="Move Selection">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-hand-icon lucide-hand"><path d="M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2"/><path d="M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2"/><path d="M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>
      </button>

      <div class="tb-divider"></div>

      <!-- Freehand Paint Tool (Lucide Paintbrush Icon) -->
      <div class="tool-with-indicator">
        <button class="tb-btn" id="tool-pen" title="Freehand Paint">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-paintbrush-icon lucide-paintbrush"><path d="m14.622 17.897-10.68-2.913"/><path d="M18.376 2.622a1 1 0 1 1 3.002 3.002L17.36 9.643a.5.5 0 0 0 0 .707l.944.944a2.41 2.41 0 0 1 0 3.408l-.944.944a.5.5 0 0 1-.707 0L8.354 7.348a.5.5 0 0 1 0-.707l.944-.944a2.41 2.41 0 0 1 3.408 0l.944.944a.5.5 0 0 0 .707 0z"/><path d="M9 8c-1.804 2.71-3.97 3.46-6.583 3.948a.507.507 0 0 0-.302.819l7.32 8.883a1 1 0 0 0 1.185.204C12.735 20.405 16 16.792 16 15"/></svg>
          <span class="pen-color-indicator" id="pen-color-dot" style="background-color: #ff4757;"></span>
        </button>
      </div>

      <!-- Pixelate Tool (Select Area) -->
      <button class="tb-btn" id="tool-pixelate" title="Pixelate Area">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-vector-square-icon lucide-vector-square"><path d="M19.5 7a24 24 0 0 1 0 10"/><path d="M4.5 7a24 24 0 0 0 0 10"/><path d="M7 19.5a24 24 0 0 0 10 0"/><path d="M7 4.5a24 24 0 0 1 10 0"/><rect x="17" y="17" width="5" height="5" rx="1"/><rect x="17" y="2" width="5" height="5" rx="1"/><rect x="2" y="17" width="5" height="5" rx="1"/><rect x="2" y="2" width="5" height="5" rx="1"/></svg>
      </button>

      <!-- Blur Tool (Select Area) -->
      <button class="tb-btn" id="tool-blur" title="Blur Area">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chart-scatter-icon lucide-chart-scatter"><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="18.5" cy="5.5" r=".5" fill="currentColor"/><circle cx="11.5" cy="11.5" r=".5" fill="currentColor"/><circle cx="7.5" cy="16.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="14.5" r=".5" fill="currentColor"/><path d="M3 3v16a2 2 0 0 0 2 2h16"/></svg>
      </button>

      <div class="tb-divider"></div>

      <!-- Undo -->
      <button class="tb-btn" id="tool-undo" title="Undo (Ctrl+Z)">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 14L4 9l5-5"></path>
          <path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"></path>
        </svg>
      </button>

      <!-- Redo -->
      <button class="tb-btn" id="tool-redo" title="Redo (Ctrl+Y)">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 14l5-5-5-5"></path>
          <path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5v0A5.5 5.5 0 0 0 9.5 20H13"></path>
        </svg>
      </button>

      <div class="tb-divider"></div>

      <!-- Delete / Cancel -->
      <button class="tb-btn tb-danger" id="tool-delete" title="Cancel Crop (Esc)">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
      </button>
    </div>

    <!-- Color Picker Popover for Pen -->
    <div id="color-palette-popover" style="display: none;">
      <div class="color-swatch" data-color="#ff4757" style="background-color: #ff4757;"></div>
      <div class="color-swatch" data-color="#ff7f50" style="background-color: #ff7f50;"></div>
      <div class="color-swatch" data-color="#ffa502" style="background-color: #ffa502;"></div>
      <div class="color-swatch" data-color="#2ed573" style="background-color: #2ed573;"></div>
      <div class="color-swatch" data-color="#1e90ff" style="background-color: #1e90ff;"></div>
      <div class="color-swatch" data-color="#a55eea" style="background-color: #a55eea;"></div>
      <div class="color-swatch" data-color="#ffffff" style="background-color: #ffffff;"></div>
      <div class="color-swatch" data-color="#000000" style="background-color: #000000;"></div>
    </div>

    <div id="hint-overlay">
      <span>Drag to crop | Esc to cancel</span>
    </div>
  </div>
  <script src="../scripts/cropper.js"></script>
</body>

</html>
